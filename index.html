<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./src/style.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="./src/assets/book.svg">
  <link rel="shortcut icon" href="#"> <!-- to stop favicon error from console logging-->
  <title>the library</title>
</head>

<body>
  <header class="header">
    <img class="header__icon" src="./src/assets/book.svg" alt="book icon">
    <div class="header__title-wrapper">
      <h1 class="header__title">The Library</h1>
      <p class="header__subtitle">Discover your next favorite book</p>
    </div>
    <button class="header__theme-button" type="button">dark</button>
  </header>
  <main>
    <section class="search">
      <h2 class="search__title">Discover Your Next Great Read</h2>
      <p class="search__description">Search millions of books, build your personal library, and never lose track of what
        to read next.</p>
      <div class="search__form">
        <img class="search__icon" src="./src/assets/search.svg" alt="magnifying glass icon">
        <input class="search__input" type="text" placeholder="Search for books by title or author...">
        <button class="search__button button" type="button" disabled>Search</button>
      </div>
    </section>
    <div class="content">
      <section class="books">
        <nav class="books__filters"></nav>
        <p class="books__message" id="books__message">What books are on your mind today?</p>
        <ul class="books__list">
        </ul>
      </section>
      <aside class="sidebar">
        <div class="sidebar__content">
          <p class="sidebar__icon">an icon</p>
          <h2 class="sidebar__title">Favourites</h2>
          <p class="sidebar__counter">3 books saved</p>
        </div>
        <ul class="sidebar__list">
        </ul>
      </aside>
    </div>
  </main>
  <footer class="footer">
    <p class="footer__text">Powered by <a class="footer__link" href="https://openlibrary.org/">Open Library</a></p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
